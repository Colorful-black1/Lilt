[package]
name = "lilt"
version = "0.1.0"
edition = "2021"
description = "Lilt - an offline local music player"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
lofty = "0.22.4"
rodio = { version = "0.20.1", default-features = false, features = ["symphonia-all"] }
cpal = "0.15.3"
rfd = "0.17.2"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
global-hotkey = "0.10.0"
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
